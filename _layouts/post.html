<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}

<body>
  {% include gtm-noscript.html %}
  {% include header.html %}
  <main class="container">
    {%if page.image %}
    <div id="image-wraper">
      <img class="" src="{{ page.image }}" alt="{{ page.alt }}" width="100%"
        height="400px">
    </div>

    {% endif %}
        <section id="main_content" class="inner">
      <h1>{{page.title}}</h1>
      {{ content }}
    </section>
  </main>

  {% include footer.html %}
  {% include scripts.html %}
</body>

</html>
